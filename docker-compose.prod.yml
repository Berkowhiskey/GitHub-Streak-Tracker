# ---------------------------------------------------------------------------
# StreakTracker - production yigini
#
# Veritabani harici bir yonetimli servistedir (Supabase); bu yuzden burada
# postgres container'i yoktur. Yerel gelistirme veritabani icin
# docker-compose.yml kullanilir.
#
# Kullanim:
#   cp .env.example .env   &&  degerleri doldur  &&  chmod 600 .env
#   mkdir -p secrets       &&  GitHub App .pem dosyasini icine koy
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Yalnizca Caddy disariya acilir (80/443). API ic aga kapalidir.
# ---------------------------------------------------------------------------

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streaktracker-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # ASP.NET Core yapilandirmasinda ic ice bolumler "__" ile ifade edilir.
      #
      # Supabase notlari:
      #  - "pooler.supabase.com" (Supavisor) kullaniliyor cunku dogrudan baglanti
      #    yalnizca IPv6 uzerinden erisilebilir.
      #  - Port 5432 = SESSION mode. Transaction mode (6543) prepared statement
      #    desteklemez; EF Core ve Hangfire ikisi de buna ihtiyac duyar.
      #  - Havuz boyutu bilincli olarak kucuk: Supabase'in ucretsiz katmanindaki
      #    baglanti butcesini tuketmemek icin (Npgsql varsayilani 100'dur).
      ConnectionStrings__DefaultConnection: >-
        Host=${SUPABASE_DB_HOST};Port=5432;Database=${SUPABASE_DB_NAME};Username=${SUPABASE_DB_USER};Password=${SUPABASE_DB_PASSWORD};SSL Mode=Require;Maximum Pool Size=12;Timeout=30;Command Timeout=60

      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL}
      App__FrontendBaseUrl: ${APP_FRONTEND_BASE_URL}
      App__CookieSameSite: ${APP_COOKIE_SAMESITE:-Lax}
      # Anahtarlar kalici volume'de tutulur; container yeniden olusturulsa bile
      # kayitli access token'lar cozulmeye devam eder.
      App__DataProtectionKeysPath: /keys
      App__RunMigrationsOnStartup: "true"

      # Birincil adres apex'tir; "www" varyanti yalnizca guvenlik agi olarak
      # eklenir (kullanici www uzerinden gelirse CORS hatasi almasin).
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_WWW:-${CORS_ALLOWED_ORIGIN}}

      Jwt__Key: ${JWT_KEY}

      GitHub__ClientId: ${GITHUB_CLIENT_ID}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET}
      GitHub__CallbackUrl: "${APP_PUBLIC_BASE_URL}/api/v1/auth/github/callback"

      GitHubApp__AppId: ${GITHUB_APP_ID}
      GitHubApp__Slug: ${GITHUB_APP_SLUG}
      GitHubApp__PrivateKeyPath: /secrets/${GITHUB_APP_PRIVATE_KEY_FILE}
    volumes:
      - dataprotection-keys:/keys
      # GitHub App imzalama anahtari - salt okunur baglanir.
      #
      # ONEMLI: Container root olmayan bir kullanici (uid 5678) olarak calisir.
      # Bind mount host izinlerini korudugu icin klasorun sahipligi de bu
      # kullaniciya verilmelidir; aksi halde dosya okunamaz ve uygulama
      # "GitHub App yapilandirilmamis" der (sessiz bir hata):
      #
      #   sudo chown -R 5678:5678 secrets
      #   sudo chmod 700 secrets && sudo chmod 400 secrets/*.pem
      - ./secrets:/secrets:ro
    networks:
      - streaktracker

  caddy:
    image: caddy:2-alpine
    container_name: streaktracker-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Alinan sertifikalar kalici olmali; aksi halde her yeniden baslatmada
      # yeniden sertifika istenir ve Let's Encrypt limitine takilir.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - streaktracker

volumes:
  dataprotection-keys:
    name: streaktracker-dataprotection-keys
  caddy-data:
    name: streaktracker-caddy-data
  caddy-config:
    name: streaktracker-caddy-config

networks:
  streaktracker:
    name: streaktracker-network
