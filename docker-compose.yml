services:
  postgres:
    image: postgres:16-alpine
    container_name: streaktracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streaktracker}
      POSTGRES_USER: ${POSTGRES_USER:-streaktracker}
      # Sifre .env dosyasindan okunur; tanimli degilse gelistirme varsayilani kullanilir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streaktracker_dev_2026}
      # Turkce karakterlerin dogru siralanmasi icin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # 5432 ve 5433 baska projelerin container'lari tarafindan kullanildigi icin 5434 secildi.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streaktracker} -d ${POSTGRES_DB:-streaktracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: streaktracker-postgres-data
